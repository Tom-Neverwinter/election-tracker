<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Election Tracker</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1b1b1b; --mute:#6b6b6b; --line:#e2e2de; --none:#d9d9d4; --d:#2b6cb0; --r:#c53030; --s1:#1f7a4d; --s2:#b45309; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --card:#1e1e1e; --ink:#eee; --mute:#9a9a9a; --line:#333; --none:#3a3a3a; --d:#63a4ff; --r:#ff6b6b; --s1:#38a56f; --s2:#b97f26; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--mute); font-size:13px; }
  .bar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:14px 0; }
  .tabs button, .modes button { font:inherit; padding:6px 14px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  .tabs button:first-child, .modes button:first-child { border-radius:6px 0 0 6px; } .tabs button:last-child, .modes button:last-child { border-radius:0 6px 6px 0; }
  .tabs { display:flex; } .tabs button { white-space:nowrap; }
  details summary { cursor:pointer; color:var(--mute); font-size:13px; }
  .tabs button[aria-pressed=true], .modes button[aria-pressed=true] { background:var(--ink); color:var(--bg); }
  .pill { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:13px; }
  .grid { display:grid; grid-template-columns: minmax(0,2fr) minmax(280px,1fr); gap:16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; }
  svg path.st { stroke:var(--bg); stroke-width:.8; cursor:pointer; }
  svg path.st:hover, svg path.st.sel { stroke:var(--ink); stroke-width:2; }
  .legend { display:flex; gap:2px; margin-top:8px; font-size:12px; color:var(--mute); flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:4px; margin-right:8px; }
  .legend i { width:14px; height:14px; border-radius:3px; display:inline-block; }
  .chips { display:flex; flex-direction:column; gap:4px; margin:8px 0; }
  .chip { display:flex; justify-content:space-between; padding:4px 8px; border-radius:4px; font-size:13px; }
  .warn { color:#b7791f; font-weight:600; font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--mute); font-weight:500; cursor:pointer; user-select:none; }
  tr { cursor:pointer; } tbody tr:hover { background:var(--bg); }
  .tw { overflow-x:auto; }
  a { color:var(--d); }
  .seats { display:flex; height:22px; border-radius:4px; overflow:hidden; margin:6px 0 2px; }
  .seats div { display:flex; align-items:center; justify-content:center; font-size:11px; color:#111; }
</style>
</head>
<body>
<main>
  <h1>Election Tracker</h1>
  <div class="sub" id="updated"></div>

  <div class="bar">
    <div class="tabs" role="group" aria-label="Offices"><button data-o="president">President</button><button data-o="senate">Senate</button><button data-o="house">House</button><button data-o="governor">Governor</button></div>
    <div class="tabs" role="group" aria-label="Election 2026"><button data-o="results">Results</button><button data-o="timeline">Timeline</button><button data-o="early">Early vote</button><button data-o="measures">Measures</button></div>
    <div class="tabs" role="group" aria-label="Background"><button data-o="states">States</button><button data-o="history">History</button></div>
    <select class="pill" id="year" aria-label="Election year" style="color:inherit" hidden></select>
    <select class="pill" id="day" aria-label="Show data from" style="color:inherit"><option value="">Live</option></select>
  </div>

  <div class="card" id="flow" style="margin-bottom:16px"></div>

  <div class="grid">
    <div class="card">
      <div class="modes" id="rmodes" role="group" aria-label="Results for" style="margin-bottom:8px" hidden></div>
      <div class="modes" id="modes" role="group" aria-label="Color the map by" style="margin-bottom:8px" hidden></div>
      <svg id="map" viewBox="0 0 975 610" role="img" aria-label="US map colored by consensus rating"></svg>
      <div class="seats" id="seats"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card" id="detail"><div class="sub">Click a state for every source's rating.</div></div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="modes" id="hmodes" role="group" aria-label="History table" style="margin-bottom:8px" hidden><button data-v="state">By state</button><button data-v="pres">Every president</button></div>
    <div class="sub" style="margin-bottom:6px" id="tnote"></div>
    <div class="tw"><table><thead><tr id="thead"></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
  <p class="sub" id="srcs"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="data.js"></script>
<script src="history.js"></script>
<script src="past/president.js"></script>
<script src="past/senate.js"></script>
<script src="past/governor.js"></script>
<script src="past/turnout.js"></script>
<script src="past/house.js"></script>
<script src="past/control.js"></script>
<script src="results-data.js"></script>
<script src="measures.js"></script>
<script src="measures-results-data.js"></script>
<script src="past/measures.js"></script>
<script src="hourly/index.js"></script>
<script type="module">
// ---- live data is fetched fresh on open, unless ?day=YYYY-MM-DD picks a saved snapshot ----
const status = t => document.getElementById('updated').textContent = t;
const HISTORY = window.HISTORY ?? {}, day = new URLSearchParams(location.search).get('day'), saved = HISTORY[day];
const picker = document.getElementById('day');
picker.append(...Object.keys(HISTORY).sort().reverse().map(d => new Option(d, d)));
picker.value = saved ? day : '';
picker.onchange = () => location.search = picker.value && '?day=' + picker.value;
if (!saved) status('Loading live data from Wikipedia, Polymarket and the early-vote feed…');
let D = saved;
try {
  D ??= await loadData();
} catch (e) {
  document.querySelector('main').innerHTML = `<h1>Couldn't load data</h1><p>${String(e).replace(/</g, '&lt;')}</p><p>Check your connection and reload.</p>`;
  throw e;
}

const CATS = [ // score thresholds on the −3 (Safe R) … +3 (Safe D) scale
  [2.5, 'Safe D', '#1c4e8f'], [1.5, 'Likely D', '#4a86c8'], [0.5, 'Lean D', '#9ec3ea'],
  [-0.5, 'Tossup', '#e7d48a'], [-1.5, 'Lean R', '#f0a8a8'], [-2.5, 'Likely R', '#d86464'], [-Infinity, 'Safe R', '#a02626'],
];
const cat = s => CATS.find(([t]) => s >= t);
const color = s => s == null ? 'var(--none)' : cat(s)[2];
const PAST = { national: TURNOUT.national, pres: PRESIDENT.list, states: Object.fromEntries(Object.keys(TURNOUT.states).map(n => [n, { t: TURNOUT.states[n], p: PRESIDENT.states[n] ?? {}, s: SENATE[n] ?? {}, g: GOVERNOR[n] ?? {} }])) };
const pct = p => p == null ? '—' : Math.round(p * 100) + '%';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let [office, hashYear] = location.hash.slice(1).split('/'); office ||= localStore('office') || 'senate'; let sel = null, sortKey = 'abs', sortDir = 1, geo;

function localStore(k, v) { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch { return null; } }

document.getElementById('updated').textContent =
  `${saved ? 'Snapshot from' : 'Live as of'} ${new Date(D.updated).toLocaleString()} · consensus = average of ${D.governor.raters.length}–${D.senate.raters.length} forecasters + Polymarket odds`;
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  year = LIVE[b.dataset.o] ?? ({ states: CTRL_LATEST, measures: MEAS_NOW }[b.dataset.o] ?? HOUSE_LATEST); office = b.dataset.o; localStore('office', office); sel = null; sortKey = { early: 'per', history: 't22' }[office] ?? 'abs'; sortDir = office === 'early' || office === 'history' ? -1 : 1; render();
});
if (!D.early) document.querySelector('[data-o=early]').remove();
if (office === 'early' && !D.early) office = 'governor';
if (!D.president) document.querySelector('[data-o=president]').remove();
if (office === 'president' && !D.president) office = 'governor';
for (const r of D.president?.races ?? []) { // 2024 result is the "held by" baseline, and the fallback where no market exists yet
  const p = PRESIDENT.states[r.state]?.[2024];
  if (!p) continue;
  r.incParty = p[2]; r.incumbent = `2024: D ${p[0]} · R ${p[1]}`;
  if (r.score == null) { r.score = Math.round(Math.max(-3, Math.min(3, (p[0] - p[1]) / 5)) * 100) / 100; r.note = 'no market yet, 2024 margin'; } // ponytail: 15+ pt margin = Safe
}
if (office === 'early') { sortKey = 'per'; sortDir = -1; }
if (office === 'history') { sortKey = 't22'; sortDir = -1; }

const EV = D.early ? new Map(D.early.states.map(s => [s.state_name, s])) : new Map();
const share = s => s.cast / s.turnout22; // ponytail: share of total 2022 turnout, not same-day 2022 pace (no public 2022 daily series)
const evColor = d3.scaleSequential([0, 0.5], d3.interpolateGreens).clamp(true);
const fmt = d3.format(',');
const num = v => v == null ? '—' : fmt(v);
const pop = s => POP[s.state_name][0], elig = s => POP[s.state_name][1], voted = s => s.cast / elig(s);
const pct1 = p => (p * 100).toFixed(1) + '%';
const feed = s => s.feedCast ?? s.cast; // what the automatic feed reported, before any hand correction
const per = s => Math.round(s.cast / elig(s) * 1e5), perPop = s => Math.round(s.cast / pop(s) * 1e5); // ballots per 100,000 eligible voters / residents
const rateColor = d3.scaleSequential([0, 40000], d3.interpolateGreens).clamp(true);
const castColor = d3.scaleSequentialSqrt([0, 7e6], d3.interpolateGreens).clamp(true); // sqrt so Texas and California don't wash out everyone else
const MODES = {
  per: { label: 'Per 100k eligible', val: s => per(s), color: rateColor, stops: [0, 10000, 20000, 30000, 40000], show: v => fmt(v), unit: 'ballots per 100,000 eligible voters' },
  share: { label: '% of 2022 vote', val: s => share(s), color: evColor, stops: [0, .1, .2, .3, .4, .5], show: v => pct(v), unit: "of the state's total 2022 vote, already cast" },
  cast: { label: 'Raw ballots', val: s => s.cast, color: castColor, stops: [0, 100000, 500000, 1000000, 3000000, 7000000], show: v => d3.format('.2~s')(v), unit: 'ballots cast (not adjusted for size)' },
};
let mode = localStore('evMode') in MODES ? localStore('evMode') : 'per';
document.getElementById('modes').innerHTML = Object.entries(MODES).map(([k, m]) => `<button data-m="${k}">${m.label}</button>`).join('');
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => { mode = b.dataset.m; localStore('evMode', mode); renderEarly(); });
const races = () => D[office].races;
const byState = () => d3.group(races(), r => r.state);
const raceIn = st => ['governor', 'senate'].flatMap(o => D[o].races.filter(r => r.state === st).map(r => [o, r]));

function spark(vals, w = 260, h = 50) { // cumulative ballots line
  const x = d3.scaleLinear([0, vals.length - 1], [0, w]), y = d3.scaleLinear([0, d3.max(vals) || 1], [h - 2, 2]);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><path d="${d3.line((v, i) => x(i), y)(vals)}" fill="none" stroke="#38a169" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

fetch('https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-albers-10m.json').then(r => r.json()).then(us => {
  geo = topojson.feature(us, us.objects.states).features;
  d3.select('#map').append('g').selectAll('path').data(geo).join('path')
    .attr('class', 'st').attr('d', d3.geoPath())
    .on('click', (e, f) => { if (office === 'history' ? PAST.states[f.properties.name] : office === 'states' ? !!CTRL[f.properties.name]?.[year] : office === 'measures' ? (year === MEAS_NOW ? MEAS : PASTM.filter(m => m.year === year)).some(m => m.state === f.properties.name) : office === 'results' ? (R?.races ?? []).some(r => r.office === rkind && r.state === f.properties.name) : office === 'early' ? EV.has(f.properties.name) : isPast() ? pastRows().some(r => r.state === f.properties.name) : byState().has(f.properties.name)) { sel = f.properties.name; render(); } })
    .append('title');
  render();
});

function render() {
  yearPicker();
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.o === office));
  document.getElementById('modes').hidden = office !== 'early';
  document.getElementById('hmodes').hidden = office !== 'history';
  document.getElementById('rmodes').hidden = office !== 'results';
  renderFlow();
  if (office === 'early') return renderEarly();
  if (office === 'history') return renderHistory();
  if (office === 'results') return renderResults();
  if (office === 'measures') return renderMeasures();
  if (office === 'timeline') return renderTimeline();
  if (office === 'states') return renderStates();
  if (isPast()) return renderPast();
  document.getElementById('legend').innerHTML = CATS.map(c => `<span><i style="background:${c[2]}"></i>${c[1]}</span>`).join('') +
    `<span><i style="background:var(--none)"></i>No race</span>`;
  const g = byState();
  d3.selectAll('path.st')
    .attr('fill', f => { const rs = g.get(f.properties.name); return color(rs && office === 'house' ? (d3.mean(rs, r => r.score > 0.5 ? 1 : r.score < -0.5 ? 0 : 0.5) - 0.5) * 6 : rs?.[0].score); })
    .classed('sel', f => f.properties.name === sel)
    .select('title').text(f => {
      const rs = g.get(f.properties.name);
      if (rs && office === 'house') { const n = k => rs.filter(r => k(r.score)).length; return `${f.properties.name}: ${n(v => v > 0.5)} D · ${n(v => v < -0.5)} R favored · ${n(v => Math.abs(v) <= 0.5)} tossup`; }
      return rs ? rs.map(r => `${r.label}: ${cat(r.score)[1]}${r.market?.pD != null ? ` · market D ${pct(r.market.pD)}` : ''}`).join('\n') : `${f.properties.name}: no race`;
    });
  renderSeats(); renderDetail(); renderTable();
  document.getElementById('srcs').innerHTML = office === 'president' ? `Sources: <a href="https://polymarket.com">Polymarket</a> state and national 2028 markets (thin: a few thousand dollars traded per state); where a state has no market, its 2024 margin from <a href="https://electionlab.mit.edu/data">MIT Election Lab</a>. <a href="${D.president.wiki}">Wikipedia: 2028 election</a>.` : `Sources: <a href="${D[office].wiki}">Wikipedia's ${office} ratings table</a> (${D[office].raters.map(esc).join(', ')}) and <a href="https://polymarket.com">Polymarket</a>.`;
}

// ---- Results tab: election night, from results-data.js (written by `node results.js`) ----
const R = window.RESULTS;
const RKIND = { S: ['senate', 'Senate'], H: ['house', 'House'], G: ['governor', 'Governor'], O: ['other', 'Other statewide'] }; // O = attorney general, secretary of state, lt. governor...
let rkind = 'S';
const rmodes = document.getElementById('rmodes');
rmodes.innerHTML = Object.entries(RKIND).map(([k, [, l]]) => `<button data-r="${k}">${l}</button>`).join('');
rmodes.querySelectorAll('button').forEach(b => b.onclick = () => { rkind = b.dataset.r; sel = null; render(); });
const rParty = p => /^dem/i.test(p) ? 'D' : /^rep/i.test(p) ? 'R' : p ? 'O' : null;
const rLead = r => r.cands[0] && r.cands[0].votes > 0 ? r.cands[0] : null;
const rSide = r => rParty(r.called ? r.winnerParty : rLead(r)?.party); // D, R, O or null (no votes yet)
const R_COLORS = { calledD: '#1c4e8f', leadD: '#9ec3ea', leadR: '#f0a8a8', calledR: '#a02626', calledO: '#9b6bcc', leadO: '#cdb4e6' };
const rColor = r => { const s = rSide(r); return s ? R_COLORS[(r.called ? 'called' : 'lead') + s] : 'var(--none)'; };
const rLabel = r => r.office === 'O' ? `${r.state} ${r.name}` : r.district != null ? `${r.state} ${r.district || 'at-large'}` : r.state;
const forecastFor = r => (D[RKIND[r.office][0]]?.races ?? []).find(f => f.state === r.state && (r.office !== 'H' || f.label.endsWith('-' + (r.district || 'AL')))); // ponytail: Senate specials share a state; the first forecast row wins
function renderResults() {
  document.querySelectorAll('#rmodes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.r === rkind));
  const rows = (R?.races ?? []).filter(r => r.office === rkind), g = d3.group(rows, r => r.state);
  const el = document.getElementById('detail');
  document.getElementById('legend').innerHTML = [['calledD', 'Called D'], ['leadD', 'Leading D'], ['leadR', 'Leading R'], ['calledR', 'Called R'], ['calledO', 'Other']]
    .map(([k, l]) => `<span><i style="background:${R_COLORS[k]}"></i>${l}</span>`).join('') + '<span><i style="background:var(--none)"></i>No results yet</span>';
  d3.selectAll('path.st')
    .attr('fill', f => { const rs = g.get(f.properties.name); if (!rs) return 'var(--none)'; if (rs.length === 1) return rColor(rs[0]);
      const n = s => rs.filter(r => rSide(r) === s).length; return color((n('D') - n('R')) / rs.length * 3); }) // House: net seats led, on the forecast scale
    .classed('sel', f => f.properties.name === sel)
    .select('title').text(f => (g.get(f.properties.name) ?? []).map(r => `${rLabel(r)}: ${rLead(r) ? `${rLead(r).name} (${rParty(rLead(r).party)}) ${rLead(r).pct}%${r.called ? ' · called' : ''}` : 'no votes yet'} · ${Math.round(r.pctIn ?? 0)}% in`).join('\n') || `${f.properties.name}: no race`);
  const k = s => rows.filter(r => r.called && rParty(r.winnerParty) === s).length, l = s => rows.filter(r => !r.called && rSide(r) === s).length;
  document.getElementById('seats').innerHTML = [[k('D'), R_COLORS.calledD, 'Called D'], [l('D'), R_COLORS.leadD, 'Leading D'], [rows.filter(r => !rSide(r)).length, 'var(--none)', 'No votes'], [l('R'), R_COLORS.leadR, 'Leading R'], [k('R'), R_COLORS.calledR, 'Called R']]
    .filter(([n]) => n).map(([n, c, t]) => `<div style="flex:${n};background:${c}" title="${t}: ${n}">${n}</div>`).join('');
  const mine = sel && g.get(sel);
  const bar = c => `<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(c.name)} <span class="sub">${esc(rParty(c.party) ?? '')}</span></span><span>${c.pct}% · ${fmt(c.votes)}</span></div>
    <div style="height:6px;background:var(--line);border-radius:3px;margin:2px 0 6px"><div style="height:6px;width:${Math.min(100, c.pct)}%;background:${R_COLORS['called' + (rParty(c.party) ?? 'O')] ?? R_COLORS.calledO};border-radius:3px"></div></div>`;
  if (!R) el.innerHTML = '<div class="sub">No results yet. They appear here once polls close and results are pulled (node results.js).</div>';
  else if (mine) el.innerHTML = mine.map(r => { const fc = forecastFor(r);
    return `<h2 style="margin:0;font-size:18px">${esc(rLabel(r))} ${r.office === 'O' ? '' : RKIND[r.office][1]}</h2>
      <div class="sub">${Math.round(r.pctIn ?? 0)}% of expected vote in · ${fmt(r.votes)} votes${r.called ? ` · <b>called for ${esc(r.winner)}</b>` : ''}</div>
      <div style="margin-top:8px">${r.cands.map(bar).join('')}</div>
      ${fc ? `<div class="sub">Forecast: ${cat(fc.score)[1]}${fc.market?.pD != null ? ` · market P(D) ${pct(fc.market.pD)}` : ''}</div>` : ''}`; }).join('<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">');
  else { const base = NOT_UP[RKIND[rkind][0]] ?? { D: 0, R: 0 };
    el.innerHTML = `<h2 style="margin:0;font-size:18px">${RKIND[rkind][1]} results</h2>
      <div class="sub">Updated ${new Date(R.updated).toLocaleString()} · ${rows.length} races · ${rows.filter(r => r.called).length} called${R.failed?.length ? ` · couldn't load ${R.failed.length} states` : ''}</div>
      <div style="margin:8px 0">${rkind === 'O' ? 'Called so far:' : 'Seats so far (not up + called):'} ${tag('D')} ${base.D + k('D')} – ${tag('R')} ${base.R + k('R')}${k('O') ? ` – other ${k('O')}` : ''} · leading: ${tag('D')} ${l('D')} – ${tag('R')} ${l('R')}</div>
      <p class="sub">Click a state for vote counts. Results from NBC News / Associated Press.</p>`; }
  head([['label', 'Race'], ['in', '% in'], ['lead', 'Leader'], ['margin', 'Margin'], ['status', 'Status'], [null, 'Forecast']], 'Closest races first. Margin = leader minus runner-up, in points.');
  const rowsT = rows.map(r => ({ ...r, label: rLabel(r), in: r.pctIn ?? 0, lead: rLead(r)?.name ?? '', margin: r.cands.length > 1 ? r.cands[0].pct - r.cands[1].pct : 100, status: r.called ? 'Called' : rLead(r) ? 'Counting' : 'No votes', fc: forecastFor(r) }));
  const tb = document.getElementById('rows');
  tb.innerHTML = sorted(rowsT, r => sortKey === 'abs' ? r.margin : r[sortKey] ?? '').map(r => `<tr data-s="${esc(r.state)}"><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${rColor(r)}"></span> <b>${esc(r.label)}</b></td>
    <td>${Math.round(r.in)}%</td><td>${esc(r.lead) || '—'}${r.lead ? ` <span class="sub">${esc(rParty(rLead(r).party))}</span>` : ''}</td><td>${r.lead ? r.margin.toFixed(1) : '—'}</td><td>${r.called ? `<b>${esc(r.status)}</b>` : r.status}</td><td>${r.fc ? cat(r.fc.score)[1] : '—'}</td></tr>`).join('');
  tb.querySelectorAll('tr').forEach(tr => tr.onclick = () => { sel = tr.dataset.s; render(); scrollTo({ top: 0, behavior: 'smooth' }); });

// ---- Timeline tab: hour by hour through election night (hourly/index.js, built by hourly-index.js) ----
const HR = window.HOURLY ?? [];

function tchart(title, series, { fmt = v => v, lo, hi, ref } = {}) { // small multi-line chart over capture time
  const W = 360, H = 150, m = { t: 10, r: 78, b: 20, l: 44 };
  const pts = series.flatMap(s => s.pts), ts = HR.map(h => new Date(h.t));
  if (!pts.length) return `<div class="card" style="padding:10px"><b style="font-size:13px">${title}</b><div class="sub">No data yet.</div></div>`;
  const x = d3.scaleTime(d3.extent(ts), [m.l, W - m.r]), vals = pts.map(p => p[1]).concat(ref ?? []);
  const y = d3.scaleLinear([lo ?? d3.min(vals), hi ?? d3.max(vals)], [H - m.b, m.t]).nice();
  if (y.domain()[0] === y.domain()[1]) y.domain([y.domain()[0] - 1, y.domain()[1] + 1]);
  const line = d3.line(p => x(p[0]), p => y(p[1]));
  const grid = y.ticks(4).map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${m.l - 4}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--mute)">${fmt(v)}</text>`).join('');
  const xt = (HR.length < 5 ? ts : x.ticks(4)).map(v => `<text x="${x(v)}" y="${H - 5}" text-anchor="middle" font-size="10" fill="var(--mute)">${d3.timeFormat('%a %-I%p')(v)}</text>`).join('');
  const refl = ref == null ? '' : `<line x1="${m.l}" x2="${W - m.r}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--mute)" stroke-dasharray="3 3"/>`;
  const lines = series.filter(s => s.pts.length).map(s => { const last = s.pts.at(-1);
    return `<path d="${line(s.pts)}" fill="none" stroke="${s.color}" stroke-width="2"/>${s.pts.length === 1 ? `<circle cx="${x(last[0])}" cy="${y(last[1])}" r="3" fill="${s.color}"/>` : ''}<text x="${x(last[0]) + 4}" y="${y(last[1]) + 4}" font-size="10" fill="${s.color}">${s.name} ${fmt(last[1])}</text>`; }).join('');
  return `<div class="card" style="padding:10px"><b style="font-size:13px">${title}</b><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}">${grid}${xt}${refl}${lines}</svg></div>`;
}
const hrSeries = (get, name, color) => ({ name, color, pts: HR.map(h => [new Date(h.t), get(h)]).filter(p => p[1] != null) });

  const seatTxt = c => c ? `${tag('D')} ${c.D} – ${tag('R')} ${c.R}` : '—';

  const line = d3.line(p => x(p[0]), p => y(p[1]));
  const paths = series.map(s => `<path d="${line(s.pts)}" fill="none" stroke="${s.color}" stroke-width="2"/>`).join('');
  const dot = now == null ? '' : `<circle cx="${x(2026)}" cy="${y(now)}" r="5" fill="var(--ink)" stroke="var(--card)" stroke-width="2"/>`;
  return `<div id="chartbox" style="position:relative"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Turnout of eligible voters by election year; the year table holds the same numbers" style="touch-action:pan-y">${grid}${ticks}${paths}${dot}<line id="cross" y1="${m.t}" y2="${H - m.b}" stroke="var(--mute)" visibility="hidden"/><rect id="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg><div id="tip" class="pill" style="position:absolute;top:0;pointer-events:none;display:none;white-space:nowrap"></div></div>
    <div class="legend">${series.map(s => `<span><i style="background:${s.color};height:3px"></i>${s.name}</span>`).join('')}${now == null ? '' : `<span><i style="background:var(--ink);border-radius:50%;width:10px;height:10px"></i>2026 early vote so far ${now.toFixed(1)}%</span>`}</div>`;
}
function wireChart() {
  const hit = document.getElementById('hit'), tip = document.getElementById('tip'), cross = document.getElementById('cross'), box = document.getElementById('chartbox');
  if (!hit) return;
  hit.onpointerleave = () => { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); };
  hit.onpointermove = e => {
    const b = box.getBoundingClientRect(), px = (e.clientX - b.left) / b.width * chart.W, yr = Math.round(chart.x.invert(px));
    const near = chart.series.flatMap(s => s.pts).reduce((a, p) => Math.abs(p[0] - yr) < Math.abs(a - yr) ? p[0] : a, Infinity);
    const rows = chart.series.map(s => [s.name, s.pts.find(p => p[0] === near)?.[1]]).filter(r => r[1] != null);
    tip.innerHTML = `<b>${near}</b> ` + rows.map(([n, v]) => `${n} ${v.toFixed(1)}%`).join(' · ');
    tip.style.display = 'block'; tip.style.left = Math.min(e.clientX - b.left + 10, b.width - tip.offsetWidth) + 'px';
    cross.setAttribute('x1', chart.x(near)); cross.setAttribute('x2', chart.x(near)); cross.setAttribute('visibility', 'visible');
  };
}

function renderHistory() {
  if (sel) histView = 'state';
  document.querySelectorAll('#hmodes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === histView));
  const legendVals = [30, 40, 50, 60, 70];
  document.getElementById('legend').innerHTML = legendVals.map((v, i) => `<span><i style="background:${turnoutColor(v)}"></i>${i === 0 ? '≤' : ''}${v}%${i === 4 ? '+' : ''}</span>`).join('') + `<span>of eligible voters who voted in the 2022 midterm</span>`;
  d3.selectAll('path.st')
    .attr('fill', f => { const t = P[f.properties.name]?.t[2022]; return t == null ? 'var(--none)' : turnoutColor(t); })
    .classed('sel', f => f.properties.name === sel)
    .select('title').text(f => { const s = P[f.properties.name]; return s ? `${f.properties.name}: ${pc(s.t[2022])} voted in 2022 · midterm average ${pc(midAvg(s.t))}` : f.properties.name; });
  document.getElementById('seats').innerHTML = '';
  const el = document.getElementById('detail'), s = P[sel];
  const col = ['var(--s1)', 'var(--s2)'];
  if (!s) {
    const nat = PAST.national;
    el.innerHTML = `<h2 style="margin:0;font-size:18px">Nationwide turnout since 1789</h2>
      ${lineChart([{ name: 'Presidential years', color: col[0], pts: nat.filter(r => r[1] != null).map(r => [r[0], r[1]]) }, { name: 'Midterm years', color: col[1], pts: nat.filter(r => r[2] != null).map(r => [r[0], r[2]]) }], nationNow())}
      <p class="sub">Share of eligible voters who voted. The 2026 dot counts early ballots only, so it will rise on Election Day. Click a state for its results back to 1976.</p>`;
  } else {
    const yrs = Object.keys(s.t).map(Number).sort((a, b) => a - b);
    const lastOf = o => Object.keys(o).sort().at(-1), mids = yrs.filter(y => y % 4 === 2);
    const hi = d3.greatest(mids, y => s.t[y]), lo = d3.least(mids, y => s.t[y]);
    el.innerHTML = `<h2 style="margin:0;font-size:18px">${esc(sel)} since ${yrs[0]}</h2>
      ${lineChart([{ name: 'Presidential years', color: col[0], pts: yrs.filter(y => y % 4 === 0).map(y => [y, s.t[y]]) }, { name: 'Midterm years', color: col[1], pts: mids.map(y => [y, s.t[y]]) }], nowRate(sel))}
      <div class="sub">Midterm average ${pc(midAvg(s.t))} · high ${pc(s.t[hi])} in ${hi} · low ${pc(s.t[lo])} in ${lo}</div>
      <div style="margin-top:8px"><a href="#" id="allst">← All states</a></div>`;
    document.getElementById('allst').onclick = e => { e.preventDefault(); sel = null; sortKey = 't22'; sortDir = -1; render(); };
  }
  wireChart();
  const tb = document.getElementById('rows');
  if (histView === 'pres') renderPresidents(tb);
  else if (s) {
    head([[null, 'Year'], [null, 'Turnout'], [null, 'President'], [null, 'Senate'], [null, 'Governor']], `${sel}, newest first. Bold letter = winning party; D and R = each party's share of the vote.`);
    const keys = o => Object.keys(o).map(k => parseInt(k));
    const years = [...new Set([...keys(s.t), ...keys(s.p), ...keys(s.s), ...keys(s.g)])].sort((a, b) => b - a);
    tb.innerHTML = years.map(y => `<tr style="cursor:default"><td><b>${y}</b></td><td>${pc(s.t[y])}</td><td>${result(s.p[y])}</td>
      <td>${[s.s[y], s.s[y + 's']].filter(Boolean).map(result).join('<br>') || '—'}</td><td>${result(s.g[y])}</td></tr>`).join('');
  } else {
    head([['state', 'State'], ['now', '2026 early so far'], ['t22', '2022 turnout'], ['t18', '2018 turnout'], ['avg', 'Midterm average'], ['t24', '2024 turnout'], ['m24', '2024 president']],
      'Turnout = share of eligible voters. Midterm average covers 1982–2022; where total ballots are unknown, votes in the top race are used. 2026 counts early ballots only, against citizens 18+. Click a state for its full history.');
    const rows = Object.entries(P).map(([state, v]) => ({ state, now: nowRate(state), t22: v.t[2022], t18: v.t[2018], t24: v.t[2024], avg: midAvg(v.t), m24: v.p[2024] ? v.p[2024][0] - v.p[2024][1] : null }));
    tb.innerHTML = sorted(rows, r => r[sortKey] ?? -1e9).map(r => `<tr data-s="${esc(r.state)}"><td><b>${esc(r.state)}</b></td><td>${pc(r.now)}</td>
      <td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${turnoutColor(r.t22)}"></span> ${pc(r.t22)}</td><td>${pc(r.t18)}</td><td>${pc(r.avg)}</td><td>${pc(r.t24)}</td>
      <td>${r.m24 == null ? '—' : `${tag(r.m24 > 0 ? 'D' : 'R')} +${Math.abs(r.m24).toFixed(1)}`}</td></tr>`).join('');
    tb.querySelectorAll('tr[data-s]').forEach(tr => tr.onclick = () => { sel = tr.dataset.s; render(); scrollTo({ top: 0, behavior: 'smooth' }); });
  }
  document.getElementById('srcs').innerHTML = `History: results for President and Senate from <a href="https://electionlab.mit.edu/data">MIT Election Lab</a> (1976–2024), governors from Wikipedia's yearly tables, turnout from the <a href="https://election.lab.ufl.edu/voter-turnout/">UF Election Lab</a> (states 1980–2024, nation 1789–2024). Every-president table from Wikipedia's election pages.`;
}

function renderSeats() {
  const counts = CATS.map(c => [c, d3.sum(races().filter(r => r.score != null && cat(r.score) === c), r => r.ev ?? 1)]); // president: weighted by electoral votes
  document.getElementById('seats').innerHTML = counts.filter(([, n]) => n).map(([c, n]) =>
    `<div style="flex:${n};background:${c[2]}" title="${c[1]}: ${n}">${n}</div>`).join('');
}

function renderDetail() {
  const el = document.getElementById('detail');
  const all = sel && byState().get(sel), rs = office === 'house' && all ? all.filter(r => r.sources.length) : all;
  const safe = office === 'house' && all ? all.filter(r => !r.sources.length) : [];
  if (!all) { el.innerHTML = '<div class="sub">Click a state (or a table row) for every source\'s rating.</div>'; return; }
  el.innerHTML = (safe.length ? `<div class="sub" style="margin-bottom:10px">${esc(sel)}: ${all.length} seats. ${safe.length} not rated competitive (safe by 2026 lean): ${tag('D')} ${safe.filter(r => r.score > 0).length} · ${tag('R')} ${safe.filter(r => r.score < 0).length}</div>` : '') + rs.map(r => {
    const m = r.market;
    return `<h2 style="margin:0;font-size:18px">${esc(r.label)} ${{ governor: 'Governor', senate: 'Senate', house: 'House', president: `President 2028 · ${r.ev} electoral votes` }[office]}</h2>
      <div class="sub">${office === 'president' ? esc(r.incumbent) || 'No 2024 result' : `Incumbent: ${esc(r.incumbent) || '—'} (${esc(r.incParty)}) · PVI ${esc(r.pvi)}`}${r.note ? ' · ' + esc(r.note) : ''}</div>
      <div style="margin:10px 0 2px;font-size:20px;font-weight:600;color:${color(r.score)}">${cat(r.score)[1]} <span class="sub">(${r.score > 0 ? '+' : ''}${r.score})</span></div>
      ${r.spread >= 0.75 ? '<div class="warn">⚠ Sources disagree on this one</div>' : ''}
      <div class="chips">${r.sources.map(s => `<div class="chip" style="background:${color(s.score)};color:${Math.abs(s.score) >= 1.5 ? '#fff' : '#111'}"><span>${esc(s.name)}</span><b>${esc(s.rating)}</b></div>`).join('')}</div>
      ${raceTrail(({ senate: 'S', governor: 'G', president: 'P' })[office] + ':' + r.label).length > 1 ? `<div class="sub" style="margin-top:6px">Polymarket P(D), hour by hour (${raceTrail(({ senate: 'S', governor: 'G', president: 'P' })[office] + ':' + r.label).map(v => Math.round(v * 100)).join(' → ')}%)</div>${spark(raceTrail(({ senate: 'S', governor: 'G', president: 'P' })[office] + ':' + r.label), 260, 36)}` : ''}
      ${m ? `<div class="sub">Polymarket: <b>${esc(m.leader)}</b> ${pct(m.leaderP)}${m.pD != null ? ` · P(D) ${pct(m.pD)}` : ''} · $${(m.volume / 1e3).toFixed(0)}k volume · <a href="${esc(m.url)}" target="_blank" rel="noopener">market</a></div>` : '<div class="sub">No Polymarket market found.</div>'}`;
  }).join('<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">');
}

function head(cols, note) { // cols: [key|null, label]
  document.getElementById('tnote').textContent = note;
  const tr = document.getElementById('thead');
  tr.innerHTML = cols.map(([k, l]) => `<th${k ? ` data-k="${k}"` : ''}>${l}${k === sortKey ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('');
  tr.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {
    sortDir = sortKey === th.dataset.k ? -sortDir : 1; sortKey = th.dataset.k; (isPast() ? renderPast : { early: renderEarly, history: renderHistory, results: renderResults, measures: renderMeasures, states: renderStates, timeline: renderTimeline }[office] ?? renderTable)();
  });
}
const sorted = (rows, val) => [...rows].sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * sortDir);

function renderEarly() {
  const M = MODES[mode];
  document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === mode));
  const E = D.early, states = E.states;
  const total = d3.sum(states, s => s.cast), t22 = d3.sum(states, s => s.turnout22);
  const nat = E.dates.map((_, i) => d3.sum(states.filter(s => s.series), s => s.series[i])); // hand-entered states: feed lifted by news-report points
  const allPop = d3.sum(Object.values(POP), p => p[0]), allElig = d3.sum(Object.values(POP), p => p[1]), repElig = d3.sum(states, elig);
  const turnoutBar = v => `<div class="seats" title="share of eligible voters"><div style="flex:${v};background:#38a169;color:#fff">Voted ${pct1(v)}</div><div style="flex:${1 - v};background:var(--none);color:var(--ink)">Not yet ${pct1(1 - v)}</div></div>`;
  const ps = states.filter(s => s.dem != null), pt = d3.sum(ps, s => s.dem + s.rep + s.other);
  document.getElementById('legend').innerHTML = M.stops.map((v, i) => `<span><i style="background:${M.color(v)}"></i>${M.show(v)}${i === M.stops.length - 1 ? '+' : ''}</span>`).join('') +
    `<span><i style="background:var(--none)"></i>Not reporting</span> <span>${M.unit}</span>`;
  d3.selectAll('path.st')
    .attr('fill', f => EV.has(f.properties.name) ? M.color(M.val(EV.get(f.properties.name))) : 'var(--none)')
    .classed('sel', f => f.properties.name === sel)
    .select('title').text(f => { const s = EV.get(f.properties.name); return s ? `${s.state_name}: ${fmt(s.cast)} cast · ${fmt(per(s))} per 100,000 eligible · ${pct(share(s))} of 2022 vote` : `${f.properties.name}: not reporting`; });
  document.getElementById('seats').innerHTML = '';
  const s = sel && EV.get(sel), el = document.getElementById('detail');
  const partyLine = (d, r, o, n) => `<div class="seats" title="registered party of voters who've cast ballots"><div style="flex:${d};background:#4a86c8;color:#fff">D ${pct(d / n)}</div><div style="flex:${o};background:var(--none);color:var(--ink)">Other ${pct(o / n)}</div><div style="flex:${r};background:#d86464;color:#fff">R ${pct(r / n)}</div></div>`;
  el.innerHTML = !s ? `<h2 style="margin:0;font-size:18px">Nationwide</h2>
      <div style="font-size:26px;font-weight:700">${fmt(total)}</div><div class="sub">corrected total · feed alone ${fmt(d3.sum(states, feed))} · hand corrections add ${fmt(total - d3.sum(states, feed))}</div><div class="sub">ballots cast in ${states.length} reporting places (states + DC) as of ${E.asOf} · ${pct(total / t22)} of those states' 2022 total vote</div>
      <div style="margin-top:8px" class="sub">US population ${fmt(allPop)} · ${fmt(allElig)} eligible voters. In the reporting places, of ${fmt(repElig)} eligible:</div>
      ${turnoutBar(total / repElig)}
      <div class="sub">${fmt(Math.round(total / repElig * 1e5))} ballots per 100,000 eligible voters</div>
      <div class="sub">"Not yet" includes people who will vote by Election Day as well as those who won't vote at all.</div>
      ${spark(nat)}<div class="sub">Cumulative ballots (feed plus news-report points), ${E.dates[0]} → ${E.asOf}</div>
      <div style="margin-top:10px" class="sub">Party registration of early voters, ${ps.length} states that report it:</div>${partyLine(d3.sum(ps, s => s.dem), d3.sum(ps, s => s.rep), d3.sum(ps, s => s.other), pt)}
      <p class="sub">Registration ≠ vote choice, and early voters skew differently than Election Day voters: mail leans D, early in-person leaned R in 2024. Compare a state to its own history, not to 50/50. Click a state for details.</p>`
    : `<h2 style="margin:0;font-size:18px">${esc(s.state_name)}</h2>
      <div style="font-size:26px;font-weight:700">${fmt(s.cast)}</div><div class="sub">ballots cast as of ${esc(s.date)} · ${pct(share(s))} of 2022's total vote (${fmt(s.turnout22)})</div>
      <div style="margin-top:8px" class="sub">Population ${fmt(pop(s))} · ${fmt(elig(s))} eligible voters</div>
      ${turnoutBar(voted(s))}
      <div class="sub">${fmt(per(s))} ballots per 100,000 eligible voters · ${fmt(perPop(s))} per 100,000 residents</div>
      ${s.note ? `<div class="warn">Hand-entered: ${esc(s.note)}<br>Feed count ${fmt(feed(s))} → corrected ${fmt(s.cast)} (+${fmt(s.cast - feed(s))}). Trend line: feed, lifted to news-report totals where they're higher.</div>` : ''}
      ${s.flag ? `<div class="warn">⚠ ${esc(s.flag)}</div>` : ''}
      ${s.series ? spark(s.series) : ''}
      <div class="sub">Mail returned ${num(s.returned)} of ${num(s.requested)} requested · in-person early ${num(s.inperson)}</div>
      ${s.dem != null ? partyLine(s.dem, s.rep, s.other, s.dem + s.rep + s.other) : '<div class="sub" style="margin-top:8px">State doesn\'t report party of early voters.</div>'}
      ${raceIn(s.state_name).map(([o, r]) => `<div style="margin-top:6px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${color(r.score)}"></span> ${o === 'governor' ? 'Governor' : 'Senate'}: ${cat(r.score)[1]}${r.market?.pD != null ? ` · market D ${pct(r.market.pD)}` : ''}</div>`).join('')}`;
  head([['state_name', 'State'], ['cast', 'Ballots (corrected)'], ['feed', 'Feed count'], ['added', 'Added'], ['pop', 'Population'], ['elig', 'Eligible voters'], ['per', 'Per 100k eligible'], ['perPop', 'Per 100k residents'], ['voted', 'Voted so far'], ['notyet', 'Not yet'], ['share', '% of 2022 vote'], ['returned', 'Mail'], ['inperson', 'In person'], ['demShare', 'Reg. D'], ['repShare', 'Reg. R'], [null, 'Trend']],
    'Click a column to sort. Per 100k = ballots per 100,000 people, so states of any size compare directly. Eligible = citizens 18+. "Not yet" includes people who will vote by Election Day. * = hand-corrected, ? = count looks wrong but has no confirmed replacement. Party = voters\' registration, only where the state reports it.');
  const v = r => ({ feed: feed(r), added: r.cast - feed(r), share: share(r), per: per(r), perPop: perPop(r), pop: pop(r), elig: elig(r), voted: voted(r), notyet: 1 - voted(r), demShare: r.dem != null ? r.dem / r.cast : -1, repShare: r.rep != null ? r.rep / r.cast : -1 }[sortKey] ?? r[sortKey]);
  const tb = document.getElementById('rows');
  tb.innerHTML = sorted(states, v).map(r => `<tr data-s="${esc(r.state_name)}"><td><b>${esc(r.state_name)}</b>${r.note ? ' *' : r.flag ? ' ?' : ''}</td><td>${fmt(r.cast)}</td><td>${r.note ? fmt(feed(r)) : '—'}</td><td>${r.note ? '+' + fmt(r.cast - feed(r)) : '—'}</td>
    <td>${fmt(pop(r))}</td><td>${fmt(elig(r))}</td><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${rateColor(per(r))}"></span> <b>${fmt(per(r))}</b></td><td>${fmt(perPop(r))}</td><td>${pct1(voted(r))}</td><td>${pct1(1 - voted(r))}</td>
    <td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${evColor(share(r))}"></span> ${pct(share(r))}</td>
    <td>${num(r.returned)}</td><td>${num(r.inperson)}</td><td>${r.dem != null ? pct(r.dem / r.cast) : '—'}</td><td>${r.rep != null ? pct(r.rep / r.cast) : '—'}</td>
    <td style="width:90px">${r.series ? spark(r.series, 90, 20) : '—'}</td></tr>`).join('') +
    Object.entries(POP).filter(([n]) => !EV.has(n)).map(([n, [p, e]]) => `<tr><td><b>${esc(n)}</b></td><td>not reporting</td><td>—</td><td>—</td><td>${fmt(p)}</td><td>${fmt(e)}</td><td colspan="10">—</td></tr>`).join('');
  tb.querySelectorAll('tr[data-s]').forEach(tr => tr.onclick = () => { sel = tr.dataset.s; render(); scrollTo({ top: 0, behavior: 'smooth' }); });
  const hand = states.filter(s => s.note).map(s => `<a href="${esc(s.source)}">${esc(s.state_name)}</a> (${esc(s.date)})`).join(', ');
  document.getElementById('srcs').innerHTML = `Early vote: <a href="${esc(E.source)}">Who Shows Up</a> (compiled by civicAPI from state and county election offices, updated each morning)${hand ? `. Hand-entered: ${hand}` : ''}. Population: Census 2025 estimates. Eligible voters: Census CVAP, ACS 2020–2024.`;
}

function renderTable() {
  const mk = races().some(r => r.market); // no district-level markets for the House
  head([['label', office === 'president' ? 'State' : 'Race'], ['incumbent', office === 'president' ? '2024 result' : 'Incumbent'], ['flip', 'Held → likely'], ['abs', 'Consensus'], ['spread', 'Disagreement'], ...(mk ? [['pD', 'Polymarket P(D)'], [null, 'Polymarket leader']] : [])],
    'Sorted by closest race. "Disagreement" = how far apart the sources are (std. dev. on a −3…+3 scale).');
  const val = r => ({ abs: Math.abs(r.score ?? 9), pD: r.market?.pD ?? -1, flip: likely(r) === r.incParty ? 1 : 0 }[sortKey] ?? r[sortKey]);
  const rows = sorted(races(), val);
  const tb = document.getElementById('rows');
  tb.innerHTML = rows.map(r => `<tr data-s="${esc(r.state)}">
    <td><b>${esc(r.label)}</b>${r.ev ? ` <span class="sub">${r.ev}</span>` : ''}</td><td>${esc(r.incumbent)}${r.incParty ? ` (${esc(r.incParty)})` : ''}${r.note ? ` <span class="sub">${esc(r.note)}</span>` : ''}</td>
    <td>${!r.incParty ? `${tag(r.score > 0 ? 'D' : 'R')} favored <span class="sub">(open)</span>` : likely(r) === r.incParty ? `${tag(r.incParty)} hold` : `${tag(r.incParty)} → ${tag(likely(r))} <b>flip</b>`}</td>
    <td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${color(r.score)}"></span> ${cat(r.score)[1]}</td>
    <td>${r.spread >= 0.75 ? '<span class="warn">' + r.spread + '</span>' : r.spread}</td>
    ${mk ? `<td>${pct(r.market?.pD)}</td><td>${esc(r.market?.leader ?? '—')} ${r.market ? pct(r.market.leaderP) : ''}</td>` : ''}</tr>`).join('');
  tb.querySelectorAll('tr').forEach(tr => tr.onclick = () => { sel = tr.dataset.s; render(); scrollTo({ top: 0, behavior: 'smooth' }); });
}
</script>
